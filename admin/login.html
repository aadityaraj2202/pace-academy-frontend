<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PACE Academy Admin Portal</title>
  <link rel="icon" type="image/png" href="/logo.png">
  <link rel="stylesheet" href="admin.css">
</head>

<body class="auth-page">
  <section class="auth-intro">
    <div class="brand intro-brand" aria-label="PACE Academy brand">
      <img src="/logo.png" alt="PACE Academy logo">
      <div class="brand-copy">
        <span>PACE ACADEMY</span>
        <small>Administration Portal</small>
      </div>
    </div>
    <h1>Manage learning content with clarity.</h1>
    <p>Sign in to publish, update and organize educational content for PACE Academy.</p>
  </section>

  <main class="auth-panel">
    <section class="auth-card" aria-labelledby="loginHeading">
      <div class="auth-brand" aria-label="PACE Academy administration portal">
        <img src="/logo.png" alt="PACE Academy logo">
        <div class="auth-brand-copy">
          <strong>PACE ACADEMY</strong>
          <span>ADMIN PORTAL</span>
        </div>
      </div>

      <p class="eyebrow">Admin portal</p>
      <h2 id="loginHeading">Welcome back</h2>
      <p>Use your administrator account to continue.</p>

      <div id="loginMessage" class="message" role="alert" aria-live="polite"></div>

      <form id="loginForm" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" type="email" autocomplete="email" required>
        </div>

        <div class="field field-spaced">
          <label for="password">Password</label>
          <input id="password" type="password" autocomplete="current-password" required>
        </div>

        <button class="button button-primary login-button" type="submit">Login</button>
      </form>

      <a class="back-link" href="https://paceiasjudiciary.com" aria-label="Back to PACE Academy Website">
        <span aria-hidden="true">←</span>
        Back to PACE Academy Website
      </a>
    </section>
  </main>

  <script src="admin.js"></script>
  <script src="login.js"></script>
</body>

</html>
