<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard | PACE Academy Admin</title>
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="dashboard.html">
        <img src="../logo.png" alt="PACE Academy logo">
        <span>PACE ACADEMY</span>
      </a>

      <nav class="sidebar-nav" aria-label="Admin navigation">
        <a class="active" href="dashboard.html">Dashboard</a>
        <a href="content.html">Content</a>
        <a href="add-content.html">Add Content</a>
      </nav>

      <div class="sidebar-footer">
       <a href="https://paceiasjudiciary.com">View public website</a>
        <button type="button" data-logout>Log out</button>
      </div>
    </aside>

    <main class="admin-main">
      <header class="page-header">
        <div>
          <p class="eyebrow">Content overview</p>
          <h1>Dashboard</h1>
          <p class="page-subtitle">A quick view of the PACE Academy content library.</p>
        </div>
        <div class="header-actions">
          <button class="menu-toggle" type="button" data-sidebar-toggle>Menu</button>
          <a class="button button-primary" href="add-content.html">Add Content</a>
        </div>
      </header>

      <div id="dashboardMessage" class="message" role="alert" aria-live="polite"></div>

      <section class="summary-grid" aria-label="Content summary">
        <article class="summary-card">
          <p>Total Content</p>
          <strong id="totalCount">—</strong>
        </article>
        <article class="summary-card">
          <p>Published</p>
          <strong id="publishedCount">—</strong>
        </article>
        <article class="summary-card">
          <p>Drafts</p>
          <strong id="draftCount">—</strong>
        </article>
      </section>

      <section class="content-card password-card">
        <div class="section-heading">
          <h2>Change Password</h2>
        </div>

        <div class="password-form-wrap">
          <div id="passwordChangeMessage" class="message" role="alert" aria-live="polite"></div>

          <form id="changePasswordForm" class="password-form" novalidate>
            <div class="field">
              <label for="currentPassword">Current Password</label>
              <input id="currentPassword" name="currentPassword" type="password" autocomplete="current-password" required>
            </div>

            <div class="field">
              <label for="newPassword">New Password</label>
              <input id="newPassword" name="newPassword" type="password" autocomplete="new-password" required>
            </div>

            <div class="field">
              <label for="confirmPassword">Confirm New Password</label>
              <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" required>
            </div>

            <div class="form-actions password-actions">
              <button type="submit" class="button button-primary">Change Password</button>
            </div>
          </form>
        </div>
      </section>

      <section class="content-card">
        <div class="section-heading">
          <h2>Recent Content</h2>
          <a href="content.html">View all content</a>
        </div>
        <div class="table-wrap">
          <table class="content-table">
            <thead>
              <tr>
                <th>Title</th>
                <th>Category</th>
                <th>Status</th>
                <th>Created</th>
              </tr>
            </thead>
            <tbody id="recentContent"></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <script src="admin.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>
